<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>উপস্থিতি ব্যবস্থাপনা</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- লগইন এলাকা -->
    <div id="login-section">
      <h2>লগইন</h2>
      <div id="admin-login">
        <h3>অ্যাডমিন লগইন</h3>
        <input type="email" id="admin-email" placeholder="ইমেইল">
        <input type="password" id="admin-password" placeholder="পাসওয়ার্ড">
        <button id="admin-login-btn">লগইন</button>
      </div>
      <hr>
      <div id="worker-login">
        <h3>কর্মী লগইন</h3>
        <input type="tel" id="worker-phone" placeholder="ফোন নম্বর (যেমন +8801XXXXXXXXX)">
        <button id="send-otp-btn">WhatsApp OTP পাঠান</button>
        <div id="otp-area" style="display:none;">
          <input type="text" id="otp-input" placeholder="OTP কোড">
          <button id="verify-otp-btn">যাচাই করুন</button>
        </div>
      </div>
    </div>

    <!-- মূল অ্যাপ এলাকা (লগইনের পর দেখানো হবে) -->
    <div id="main-section" style="display:none;">
      <div id="user-info"></div>
      <div id="admin-panel" style="display:none;"></div>
      <div id="worker-panel" style="display:none;">
        <div id="calendar-container"></div>
        <div id="attendance-actions">
          <button id="start-work-btn">কাজ শুরু</button>
          <button id="stop-work-btn">কাজ বন্ধ</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
